name: Android APK

# Builds an installable debug APK on every push that touches the app or the
# shared core, and on manual dispatch. No account or signing secret is needed
# for a debug APK; the artifact is attached to the run.
on:
  push:
    paths:
      - 'android/**'
      - 'shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
      # Build-time config. Set these as repository secrets to ship a connected
      # APK; left empty the app still builds and runs on local state.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_AGENT_URL: ${{ secrets.EXPO_PUBLIC_AGENT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate native Android project
        working-directory: android
        run: npx expo prebuild --platform android --no-install

      - name: Tune Gradle for CI
        working-directory: android/android
        run: |
          printf '\n# CI tuning\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m\norg.gradle.daemon=false\n' >> gradle.properties

      - name: Gradle assembleDebug
        working-directory: android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mypro-debug-apk
          path: android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
