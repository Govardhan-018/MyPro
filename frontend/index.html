<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <!--
      No `viewport-fit=cover`. It lets the page paint under the system bars,
      but Android browsers report `env(safe-area-inset-bottom)` as 0 in an
      ordinary tab — so there is nothing to compensate with, and the bottom
      navigation ended up underneath the system navigation bar with its
      labels sliced off.

      `interactive-widget=resizes-content` stays: it makes the on-screen
      keyboard shrink the viewport, so bottom-anchored sheets sit above it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
