<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the app paint under the notch and the home
      indicator; the safe-area insets in the CSS keep content clear of both.
      interactive-widget=resizes-content makes the on-screen keyboard shrink
      the viewport, so `dvh` sizing and bottom-anchored sheets stay above it
      instead of being covered.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
