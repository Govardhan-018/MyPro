# Render blueprint — deploys backend-render as a single web service.
# Render → New → Blueprint → select this repo.
#
# Values are inlined here ONLY where they are public by design:
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY and SUPABASE_JWKS_URL are shipped
#   to browsers anyway, and RLS is what protects the data.
#
# The three real secrets stay `sync: false` so they are typed into the Render
# dashboard and never committed to this repository:
#   SUPABASE_SECRET_KEY    — bypasses RLS entirely
#   INTERNAL_SERVICE_TOKEN — must match backend-local/.env
#   TOKEN_ENCRYPTION_KEY   — encrypts Gmail OAuth tokens at rest
services:
  - type: web
    name: mypro-core
    runtime: node
    rootDir: backend-render
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Public Supabase config
      - key: SUPABASE_URL
        value: https://kssucdvrfzbdkyzovmjo.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_fSwoeDUEFGyiaJLWPZXKKA_DvkvUAUc
      - key: SUPABASE_JWKS_URL
        value: https://kssucdvrfzbdkyzovmjo.supabase.co/auth/v1/.well-known/jwks.json

      # Secrets — set these in the Render dashboard
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false

      # Your Vercel origin(s), comma separated. Set once the frontend is up.
      - key: CORS_ORIGINS
        sync: false

      # Leave unset: the laptop publishes its own URL into node_status on
      # every start, so an ephemeral quick-tunnel address needs no redeploy.
      # Only set this if you move to a fixed/named tunnel.
      - key: LOCAL_AGENT_URL
        sync: false

      # The in-process clock, retired in Phase 11. Render's free instance
      # sleeps after ~15 minutes of inactivity, which killed the cron with the
      # process — the morning brief silently never arrived. The drain loop now
      # runs on the laptop (backend-local) and the phone's OS does the firing.
      # Never set this to true while backend-local also has it on.
      - key: SCHEDULER_ENABLED
        value: "false"

      # Web Push (Phase 6.2). Only the PUBLIC key belongs here: render serves
      # it to browsers at GET /me/push so nothing is baked into a bundle. The
      # private key lives on the laptop, which is the half that sends.
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false

      # Gmail (Phase 7). An OAuth client from the Google Cloud console.
      # ⚠️ An app left in "Testing" issues refresh tokens that expire after
      # 7 days, so the mailbox silently disconnects weekly. Publishing it
      # needs Google's review for the restricted gmail.readonly scope.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must match the console exactly, including the /api/v1 prefix.
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Where the OAuth callback returns the browser. Also reported by the
      # keep-alive ping as this node's address.
      - key: APP_URL
        sync: false

      # Strava (Phase 20.5) — optional, read-only training history.
      # Create an app at https://www.strava.com/settings/api. The redirect
      # URI must be exactly <this service>/api/v1/strava/callback.
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        sync: false

# ---------------------------------------------------------------------
# Staying awake
#
# Render's free web service sleeps after ~15 minutes with no inbound
# request. Nothing here can prevent that — the fix lives in Supabase:
# `supabase/migrations/0015_keepalive.sql` schedules pg_cron to POST to
# /api/v1/internal/keepalive every 10 minutes through pg_net, with the
# shared secret read from the Vault.
#
# Two things to know before relying on it:
#   - Free instance hours are finite (~750/month at the time of writing).
#     One service kept awake around the clock is ~730, so this works for
#     exactly one service and leaves no room for a second.
#   - The ping is not the scheduler. SCHEDULER_ENABLED stays "false" here;
#     the clock runs on the laptop. Two schedulers would double-send.
# ---------------------------------------------------------------------
