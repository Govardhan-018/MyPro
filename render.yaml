# Render blueprint — two web services.
#
#   mypro-core   backend-render   always-on CRUD, OAuth, notifications
#   mypro-agent  backend-local    the assistant: model, skills, the clock
#
# Render → New → Blueprint → select this repo. See
# docs/DEPLOY_AGENT_TO_RENDER.md for the full walkthrough, and read the
# free-tier note at the bottom of this file BEFORE deploying both.
#
# Values are inlined here ONLY where they are public by design:
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY and SUPABASE_JWKS_URL are shipped
#   to browsers anyway, and RLS is what protects the data.
#
# The three real secrets stay `sync: false` so they are typed into the Render
# dashboard and never committed to this repository:
#   SUPABASE_SECRET_KEY    — bypasses RLS entirely
#   INTERNAL_SERVICE_TOKEN — must match backend-local/.env
#   TOKEN_ENCRYPTION_KEY   — encrypts Gmail OAuth tokens at rest
services:
  - type: web
    name: mypro-core
    runtime: node
    rootDir: backend-render
    # --include=dev is load-bearing. NODE_ENV=production is set below and
    # npm reads it as omit=dev, so a plain `npm install` skips
    # @nestjs/cli and the build dies with "sh: 1: nest: not found".
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Public Supabase config
      - key: SUPABASE_URL
        value: https://kssucdvrfzbdkyzovmjo.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_fSwoeDUEFGyiaJLWPZXKKA_DvkvUAUc
      - key: SUPABASE_JWKS_URL
        value: https://kssucdvrfzbdkyzovmjo.supabase.co/auth/v1/.well-known/jwks.json

      # Secrets — set these in the Render dashboard
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false

      # Your Vercel origin(s), comma separated. Set once the frontend is up.
      - key: CORS_ORIGINS
        sync: false

      # Leave unset: the laptop publishes its own URL into node_status on
      # every start, so an ephemeral quick-tunnel address needs no redeploy.
      # Only set this if you move to a fixed/named tunnel.
      - key: LOCAL_AGENT_URL
        sync: false

      # The in-process clock, retired in Phase 11. Render's free instance
      # sleeps after ~15 minutes of inactivity, which killed the cron with the
      # process — the morning brief silently never arrived. The drain loop now
      # runs on the laptop (backend-local) and the phone's OS does the firing.
      # Never set this to true while backend-local also has it on.
      - key: SCHEDULER_ENABLED
        value: "false"

      # Web Push (Phase 6.2). Only the PUBLIC key belongs here: render serves
      # it to browsers at GET /me/push so nothing is baked into a bundle. The
      # private key lives on the laptop, which is the half that sends.
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false

      # Gmail (Phase 7). An OAuth client from the Google Cloud console.
      # ⚠️ An app left in "Testing" issues refresh tokens that expire after
      # 7 days, so the mailbox silently disconnects weekly. Publishing it
      # needs Google's review for the restricted gmail.readonly scope.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional override. The callback is derived from RENDER_EXTERNAL_URL
      # (<service URL>/api/v1/gmail/callback); register that URL in Google Cloud.
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Where the OAuth callback returns the browser. Also reported by the
      # keep-alive ping as this node's address.
      - key: APP_URL
        sync: false

      # Strava (Phase 20.5) — optional, read-only training history.
      # Create an app at https://www.strava.com/settings/api. The redirect
      # URI must be exactly <this service>/api/v1/strava/callback.
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        sync: false

  # -------------------------------------------------------------------
  # The agent. Everything the assistant is: the model, the 37 skills, the
  # agent core, research, and the clock (drain loop, Pulse, refreshes).
  #
  # Moving this off the laptop means GROQ_API_KEY and the Web Push private
  # key now live on Render. That is a real change in posture — until now
  # the model key never left one machine — made in exchange for an agent
  # that answers when the laptop is shut. Both are set by hand below.
  # -------------------------------------------------------------------
  - type: web
    name: mypro-agent
    runtime: node
    rootDir: backend-local
    # --include=dev is load-bearing. NODE_ENV=production is set below and
    # npm reads it as omit=dev, so a plain `npm install` skips
    # @nestjs/cli and the build dies with "sh: 1: nest: not found".
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Public Supabase config — same project as the core.
      - key: SUPABASE_URL
        value: https://kssucdvrfzbdkyzovmjo.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_fSwoeDUEFGyiaJLWPZXKKA_DvkvUAUc

      # Secrets — set in the Render dashboard.
      - key: SUPABASE_SECRET_KEY
        sync: false
      # MUST be byte-identical to mypro-core's value.
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      # The model keys. Previously laptop-only; now they live here.
      # Two vendors on purpose: Groq is fast but 8,000 tokens/minute free,
      # Gemini Flash Lite is 250,000/minute and 500 requests/day but slower
      # and often congested. Each covers the other's failure mode.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional extra vendors, both OpenAI-compatible. Cohere is the
      # fastest measured and does tool calling; SambaNova needs billing.
      - key: COHERE_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      # Chat carries the tool results and the memory, so it wants the big
      # token budget. A model may be prefixed with its vendor; no prefix
      # means Groq. Never a Gemini *Flash* model here — 20 requests/day.
      - key: ASSISTANT_MODEL
        value: gemini:gemini-flash-lite-latest
      # Routing and planning are small and fast; Groq suits them, and it
      # keeps the Gemini daily budget for the conversation itself.
      - key: ASSISTANT_ROUTER_MODEL
        value: openai/gpt-oss-120b
      - key: ASSISTANT_PLANNER_MODEL
        value: openai/gpt-oss-120b
      # Tried in order when the chat model fails after its retries. Worth
      # having because each vendor fails differently.
      - key: LLM_FALLBACK_MODEL
        value: cohere:command-a-03-2025,openai/gpt-oss-120b

      # Your Vercel origin(s), comma separated. The web app calls this
      # service directly for /assistant/* — without the origin here, every
      # assistant request fails CORS.
      - key: CORS_ORIGINS
        sync: false

      # This service's own public origin, heartbeated into node_status so
      # the web app can find it. No /api/v1 suffix — the client appends it.
      # Render fills this from the service's real hostname, so it survives
      # a rename and needs no redeploy.
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: mypro-agent
          property: hostport
          # Rendered as host:port; prefix it with https:// in the dashboard
          # if Render does not. Verify the value after the first deploy:
          #   select base_url from node_status where node = 'local';

      # The core's API root, for the two things only it can do: sending
      # mail (it holds the Gmail tokens) and reading Strava.
      - key: RENDER_API_URL
        fromService:
          type: web
          name: mypro-core
          property: host
          # A bare host is fine: the agent adds https:// and /api/v1 itself
          # (backend-local `renderApiBase`).

      # THE CLOCK LIVES HERE. mypro-core keeps SCHEDULER_ENABLED=false.
      # Two schedulers race for the same rows and double-send everything.
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_STALE_MINUTES
        value: "120"

      # Web Push (Phase 6.2). This service sends, so it needs both halves.
      # The PUBLIC key also goes to mypro-core and the frontend.
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        sync: false

      # Research providers (Phase 20) — all optional. With none of them set
      # research still works on the free keyless providers. A Guardian key
      # is the one worth adding: free, instant, ~12,000 calls/day.
      - key: GUARDIAN_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: NEWS_RSS_FEEDS
        sync: false

# ---------------------------------------------------------------------
# Staying awake, and the free-tier arithmetic
#
# Render's free web services sleep after ~15 minutes with no inbound
# request. For the core that only costs a cold start; for the agent it
# means the drain loop and the Pulse stop, so the 8am brief never fires.
# Supabase does the waking: pg_cron + pg_net POST /internal/keepalive
# every 10 minutes (supabase/migrations/0015 and 0016).
#
# ⚠️ You almost certainly cannot keep BOTH awake. Free instance hours are
# pooled per account (~750/month at the time of writing — check your own
# dashboard, this number moves). One service resident around the clock is
# ~730 of them. So:
#
#   - mypro-agent is the one that is kept awake. It owns the clock.
#   - mypro-core is left to sleep and wakes on demand, which costs a
#     ~30s cold start on the first screen after a quiet period.
#
# That is why 0016 schedules the agent ping and unschedules the core one.
# If you ever move to a paid instance, re-enable the core ping and stop
# worrying about this entirely.
# ---------------------------------------------------------------------
